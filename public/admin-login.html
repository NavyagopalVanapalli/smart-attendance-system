<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Smart Attendance</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .login-card form {
      grid-template-columns: 1fr;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="card login-card">
      <h2>🛡️ Admin Login</h2>
      <p style="color: #cbd5e1; font-size: 0.88rem; margin-top: 5px;">Enter administrative credentials to continue</p>
      
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label>Admin ID / Email</label>
          <input type="text" id="adminUser" placeholder="e.g. admin" required>
        </div>
        <div class="form-group">
  <label>Password</label>
  <div class="pwd-wrapper">
    <input type="password" id="adminPass" placeholder="••••••••" required>
    <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('adminPass', this)">
      <i class="fa-solid fa-eye"></i>
    </button>
  </div>
</div>
        <button type="submit" id="loginBtn" class="btn" style="margin-top: 10px;">Login to Dashboard</button>
      </form>

      <a href="login.html" class="btn btn-back" style="margin-top: 20px; width: 100%; display: inline-block;">⬅ Back to Main Portal</a>
    </div>
  </div>

  <script>
    async function handleAdminLogin(e) {
      e.preventDefault();
      const adminId = document.getElementById("adminUser").value.trim();
      const password = document.getElementById("adminPass").value.trim();
      const btn = document.getElementById("loginBtn");

      if (!adminId || !password) {
        alert("Please fill in all fields.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Authenticating...";

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminId, password })
        });

        const data = await response.json();

        if (data.success) {
          sessionStorage.setItem("isAdminLoggedIn", "true");
          sessionStorage.setItem("activeAdmin", JSON.stringify(data.admin));
          window.location.href = "admin.html";
        } else {
          alert("❌ " + (data.message || "Invalid Admin Credentials"));
        }
      } catch (err) {
        alert("Server connection error. Make sure node server is running.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Login to Dashboard";
      }
    }

    function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector("i");
    if (input.type === "password") {
      input.type = "text";
      icon.className = "fa-solid fa-eye-slash";
    } else {
      input.type = "password";
      icon.className = "fa-solid fa-eye";
    }
  }
  </script>
</body>
</html>
