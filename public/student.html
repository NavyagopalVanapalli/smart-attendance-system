<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student QR Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.15), transparent 40%),
                  linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 32px 28px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: #38bdf8; }
    p { font-size: 0.88rem; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }

    .input-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    input[readonly] { background: rgba(30, 41, 59, 0.4); opacity: 0.8; cursor: not-allowed; border-color: rgba(255, 255, 255, 0.08); }

    .btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: all 0.25s ease;
    }

    .btn:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5); }
    .btn:disabled { background: #475569; border-color: transparent; cursor: not-allowed; transform: none; box-shadow: none; }

    .status-msg { margin-top: 18px; font-size: 0.88rem; border-radius: 12px; padding: 12px; display: none; backdrop-filter: blur(10px); }
    .status-msg.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .status-msg.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }

    .device-info { font-size: 0.75rem; color: #64748b; margin-top: 16px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 Class Attendance</h2>
    <p>Enter your Roll Number to verify classroom location and submit attendance.</p>

    <div class="input-group">
      <label for="rollNo">Roll Number</label>
      <input type="text" id="rollNo" placeholder="e.g., 2585351101" autocomplete="off" />
    </div>

    <button id="submitBtn" class="btn" onclick="submitAttendance()">Submit Attendance</button>

    <div id="statusMsg" class="status-msg"></div>
    <div id="deviceInfo" class="device-info"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('sessionId');

    document.addEventListener('DOMContentLoaded', () => {
      const savedRollNo = localStorage.getItem('assigned_roll_no');
      const rollInput = document.getElementById('rollNo');
      const deviceInfo = document.getElementById('deviceInfo');

      if (savedRollNo) {
        rollInput.value = savedRollNo;
        rollInput.readOnly = true;
        deviceInfo.innerText = "🔒 Device linked to Roll No: " + savedRollNo;
      }
    });

    function showStatus(message, isSuccess) {
      const msgDiv = document.getElementById('statusMsg');
      msgDiv.innerText = message;
      msgDiv.className = `status-msg ${isSuccess ? 'success' : 'error'}`;
      msgDiv.style.display = 'block';
    }

    async function submitAttendance() {
      const rollInput = document.getElementById('rollNo');
      const rollNo = rollInput.value.trim().toUpperCase();
      const savedRollNo = localStorage.getItem('assigned_roll_no');
      const btn = document.getElementById('submitBtn');

      if (!rollNo) {
        showStatus("Please enter your Roll Number.", false);
        return;
      }

      if (savedRollNo && savedRollNo !== rollNo) {
        showStatus("This phone is locked to Roll No: " + savedRollNo, false);
        return;
      }

      if (!sessionId) {
        showStatus("Invalid QR code link. Missing session parameters.", false);
        return;
      }

      btn.disabled = true;
      btn.innerText = "Verifying Location...";

      if (!navigator.geolocation) {
        showStatus("Geolocation is not supported by your browser.", false);
        btn.disabled = false;
        btn.innerText = "Submit Attendance";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const studentLat = position.coords.latitude;
          const studentLng = position.coords.longitude;

          try {
            const response = await fetch('/api/qr/verify-student', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                rollNo,
                studentLat,
                studentLng,
                sessionId
              })
            });

            const data = await response.json();

            if (data.success) {
              localStorage.setItem('assigned_roll_no', rollNo);
              rollInput.readOnly = true;
              document.getElementById('deviceInfo').innerText = "🔒 Device linked to Roll No: " + rollNo;
              showStatus(data.message, true);
            } else {
              showStatus(data.message, false);
            }
          } catch (err) {
            showStatus("Network error submitting attendance. Try again.", false);
          } finally {
            btn.disabled = false;
            btn.innerText = "Submit Attendance";
          }
        },
        (error) => {
          showStatus("GPS permission denied or unavailable. Please enable Precise Location.", false);
          btn.disabled = false;
          btn.innerText = "Submit Attendance";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
