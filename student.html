<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student QR Attendance</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f172a; color: white; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    input { width: 100%; padding: 0.75rem; margin: 1rem 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; box-sizing: border-box; text-transform: uppercase; }
    button { width: 100%; padding: 0.75rem; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    #statusMsg { margin-top: 1rem; font-size: 0.9rem; word-break: break-word; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📍 Mark Class Attendance</h2>
    <p style="font-size: 0.85rem; color: #94a3b8;">Enter your Roll Number and grant GPS permission to verify classroom location.</p>
    
    <input type="text" id="studentRollNo" placeholder="e.g. 101" required />
    <button id="submitBtn">Submit Attendance</button>
    
    <div id="statusMsg"></div>
  </div>

  <script>
    // Extract session ID from URL params (e.g. /student?sessionId=MCA_1stYear_SecA_Hour1_2026-07-27)
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('sessionId');

    document.getElementById("submitBtn").addEventListener("click", () => {
      const rollNo = document.getElementById("studentRollNo").value.trim();
      const statusMsg = document.getElementById("statusMsg");

      if (!rollNo) {
        alert("Please enter your Roll Number!");
        return;
      }

      if (!sessionId) {
        statusMsg.style.color = "#ef4444";
        statusMsg.textContent = "Invalid QR link! Please re-scan the QR code generated by faculty.";
        return;
      }

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your mobile browser.");
        return;
      }

      statusMsg.style.color = "#3b82f6";
      statusMsg.textContent = "Fetching GPS coordinates... Please wait.";

      const geoOptions = {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
      };

      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const response = await fetch(`${window.location.origin}/api/qr/verify-student`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              rollNo: rollNo,
              studentLat: position.coords.latitude,
              studentLng: position.coords.longitude,
              sessionId: sessionId
            })
          });

          const data = await response.json();
          if (data.success) {
            statusMsg.style.color = "#10b981";
            statusMsg.textContent = data.message;
            document.getElementById("studentRollNo").value = "";
          } else {
            statusMsg.style.color = "#ef4444";
            statusMsg.textContent = data.message;
          }
        } catch (err) {
          statusMsg.style.color = "#ef4444";
          statusMsg.textContent = "Failed to connect to backend server.";
        }
      }, (err) => {
        statusMsg.style.color = "#ef4444";
        statusMsg.textContent = "Location access denied or timed out! Please turn on GPS and allow location permission.";
      }, geoOptions);
    });
  </script>
</body>
</html>
